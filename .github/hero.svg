<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="inferGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="computeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="520" fill="url(#grid)"/>
  </g>

  <!-- Title -->
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" filter="url(#glow)">SOVEREIGN AI COOKBOOK</text>
  <text x="600" y="92" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16">Forjar Deployment Configs for the PAIML Stack</text>

  <!-- Tags -->
  <g transform="translate(600, 108)">
    <rect x="-280" y="0" width="120" height="24" rx="12" fill="#21262d" stroke="#f97316" stroke-width="1.5"/>
    <text x="-220" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#f97316" text-anchor="middle">8 stacks</text>

    <rect x="-148" y="0" width="120" height="24" rx="12" fill="#21262d" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="-88" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#3b82f6" text-anchor="middle">12 recipes</text>

    <rect x="-16" y="0" width="140" height="24" rx="12" fill="#21262d" stroke="#10b981" stroke-width="1.5"/>
    <text x="54" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#10b981" text-anchor="middle">86 resources</text>

    <rect x="136" y="0" width="140" height="24" rx="12" fill="#21262d" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="206" y="16" font-family="ui-monospace, monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">docker targets</text>
  </g>

  <!-- Layer: Applications (top) -->
  <text x="60" y="170" fill="#6b7280" font-family="system-ui" font-size="11" font-weight="600">APPLICATIONS</text>

  <!-- realizar -->
  <g transform="translate(60, 178)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#3b82f6" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#inferGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#inferGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">realizar</text>
    <text x="10" y="42" fill="#93c5fd" font-family="monospace" font-size="9">model serving</text>
  </g>

  <!-- whisper-apr -->
  <g transform="translate(215, 178)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#3b82f6" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#inferGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#inferGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">whisper-apr</text>
    <text x="10" y="42" fill="#93c5fd" font-family="monospace" font-size="9">speech recognition</text>
  </g>

  <!-- trueno-rag -->
  <g transform="translate(370, 178)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#ragGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#ragGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">trueno-rag</text>
    <text x="10" y="42" fill="#c4b5fd" font-family="monospace" font-size="9">RAG pipeline</text>
  </g>

  <!-- Layer: ML Core -->
  <text x="60" y="260" fill="#6b7280" font-family="system-ui" font-size="11" font-weight="600">ML CORE</text>

  <!-- entrenar -->
  <g transform="translate(60, 268)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#10b981" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#trainGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#trainGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">entrenar</text>
    <text x="10" y="42" fill="#6ee7b7" font-family="monospace" font-size="9">training + LoRA</text>
  </g>

  <!-- aprender -->
  <g transform="translate(215, 268)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#10b981" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#trainGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#trainGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">aprender</text>
    <text x="10" y="42" fill="#6ee7b7" font-family="monospace" font-size="9">ML models</text>
  </g>

  <!-- Layer: Data -->
  <text x="60" y="350" fill="#6b7280" font-family="system-ui" font-size="11" font-weight="600">DATA</text>

  <!-- trueno-db -->
  <g transform="translate(60, 358)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#f59e0b" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#dataGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#dataGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">trueno-db</text>
    <text x="10" y="42" fill="#fcd34d" font-family="monospace" font-size="9">vector + analytics</text>
  </g>

  <!-- alimentar -->
  <g transform="translate(215, 358)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#f59e0b" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#dataGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#dataGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">alimentar</text>
    <text x="10" y="42" fill="#fcd34d" font-family="monospace" font-size="9">data ingestion</text>
  </g>

  <!-- pacha -->
  <g transform="translate(370, 358)">
    <rect width="145" height="55" rx="8" fill="#21262d" stroke="#f59e0b" stroke-width="2"/>
    <rect width="145" height="22" rx="8" fill="url(#dataGrad)"/>
    <rect x="0" y="14" width="145" height="8" fill="url(#dataGrad)"/>
    <text x="72" y="16" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">pacha</text>
    <text x="10" y="42" fill="#fcd34d" font-family="monospace" font-size="9">model registry</text>
  </g>

  <!-- Layer: Compute + Infra -->
  <text x="60" y="440" fill="#6b7280" font-family="system-ui" font-size="11" font-weight="600">COMPUTE + INFRA</text>

  <!-- trueno -->
  <g transform="translate(60, 448)">
    <rect width="107" height="50" rx="8" fill="#21262d" stroke="#ef4444" stroke-width="2"/>
    <rect width="107" height="20" rx="8" fill="url(#computeGrad)"/>
    <rect x="0" y="12" width="107" height="8" fill="url(#computeGrad)"/>
    <text x="53" y="15" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">trueno</text>
    <text x="8" y="38" fill="#fca5a5" font-family="monospace" font-size="8">SIMD/GPU</text>
  </g>

  <!-- repartir -->
  <g transform="translate(177, 448)">
    <rect width="107" height="50" rx="8" fill="#21262d" stroke="#ef4444" stroke-width="2"/>
    <rect width="107" height="20" rx="8" fill="url(#computeGrad)"/>
    <rect x="0" y="12" width="107" height="8" fill="url(#computeGrad)"/>
    <text x="53" y="15" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">repartir</text>
    <text x="8" y="38" fill="#fca5a5" font-family="monospace" font-size="8">distributed</text>
  </g>

  <!-- renacer -->
  <g transform="translate(294, 448)">
    <rect width="107" height="50" rx="8" fill="#21262d" stroke="#06b6d4" stroke-width="2"/>
    <rect width="107" height="20" rx="8" fill="url(#obsGrad)"/>
    <rect x="0" y="12" width="107" height="8" fill="url(#obsGrad)"/>
    <text x="53" y="15" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">renacer</text>
    <text x="8" y="38" fill="#67e8f9" font-family="monospace" font-size="8">tracing</text>
  </g>

  <!-- pepita -->
  <g transform="translate(411, 448)">
    <rect width="107" height="50" rx="8" fill="#21262d" stroke="#06b6d4" stroke-width="2"/>
    <rect width="107" height="20" rx="8" fill="url(#obsGrad)"/>
    <rect x="0" y="12" width="107" height="8" fill="url(#obsGrad)"/>
    <text x="53" y="15" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">pepita</text>
    <text x="8" y="38" fill="#67e8f9" font-family="monospace" font-size="8">isolation</text>
  </g>

  <!-- Right side: Stack cards -->
  <text x="600" y="170" fill="#6b7280" font-family="system-ui" font-size="11" font-weight="600">DEPLOYABLE STACKS</text>

  <!-- Stack 01 -->
  <g transform="translate(600, 178)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">01</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">inference</text>
    <text x="130" y="22" fill="#6b7280" font-family="monospace" font-size="10">realizar</text>
  </g>

  <!-- Stack 02 -->
  <g transform="translate(600, 218)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">02</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">training</text>
    <text x="130" y="22" fill="#6b7280" font-family="monospace" font-size="10">entrenar</text>
  </g>

  <!-- Stack 03 -->
  <g transform="translate(600, 258)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">03</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">rag</text>
    <text x="130" y="22" fill="#6b7280" font-family="monospace" font-size="10">trueno-db + rag</text>
  </g>

  <!-- Stack 04 -->
  <g transform="translate(600, 298)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">04</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">speech</text>
    <text x="130" y="22" fill="#6b7280" font-family="monospace" font-size="10">whisper-apr</text>
  </g>

  <!-- Stack 05 -->
  <g transform="translate(600, 338)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">05</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">distributed</text>
    <text x="130" y="22" fill="#6b7280" font-family="monospace" font-size="10">repartir + realizar</text>
  </g>

  <!-- Stack 06 (highlighted) -->
  <g transform="translate(600, 378)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#f97316" stroke-width="2"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">06</text>
    <text x="32" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">full-stack</text>
    <text x="130" y="22" fill="#fb923c" font-family="monospace" font-size="10">all components</text>
  </g>

  <!-- Stack 07 -->
  <g transform="translate(600, 418)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">07</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">data-pipeline</text>
    <text x="150" y="22" fill="#6b7280" font-family="monospace" font-size="10">ingest+train</text>
  </g>

  <!-- Stack 08 -->
  <g transform="translate(600, 458)">
    <rect width="270" height="34" rx="6" fill="#21262d" stroke="#374151" stroke-width="1"/>
    <text x="10" y="22" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">08</text>
    <text x="32" y="22" fill="#e5e7eb" font-family="monospace" font-size="11">observability</text>
    <text x="150" y="22" fill="#6b7280" font-family="monospace" font-size="10">renacer</text>
  </g>

  <!-- Right side: forjar deploy flow -->
  <g transform="translate(900, 178)">
    <rect width="260" height="310" rx="10" fill="#0d1117" stroke="#374151" stroke-width="1"/>
    <text x="130" y="25" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-size="11" font-weight="600">FORJAR WORKFLOW</text>

    <!-- Step 1 -->
    <text x="20" y="55" fill="#6b7280" font-family="monospace" font-size="10">$</text>
    <text x="33" y="55" fill="#f97316" font-family="monospace" font-size="10">forjar validate</text>
    <text x="20" y="72" fill="#4ade80" font-family="monospace" font-size="9">OK: 86 resources</text>

    <!-- Arrow -->
    <text x="130" y="92" text-anchor="middle" fill="#374151" font-family="monospace" font-size="12">|</text>

    <!-- Step 2 -->
    <text x="20" y="112" fill="#6b7280" font-family="monospace" font-size="10">$</text>
    <text x="33" y="112" fill="#f97316" font-family="monospace" font-size="10">forjar plan</text>
    <text x="20" y="129" fill="#93c5fd" font-family="monospace" font-size="9">DAG: 4 machines</text>

    <!-- Arrow -->
    <text x="130" y="149" text-anchor="middle" fill="#374151" font-family="monospace" font-size="12">|</text>

    <!-- Step 3 -->
    <text x="20" y="169" fill="#6b7280" font-family="monospace" font-size="10">$</text>
    <text x="33" y="169" fill="#f97316" font-family="monospace" font-size="10">forjar apply</text>
    <text x="20" y="186" fill="#4ade80" font-family="monospace" font-size="9">86 converged, 0 failed</text>

    <!-- Arrow -->
    <text x="130" y="206" text-anchor="middle" fill="#374151" font-family="monospace" font-size="12">|</text>

    <!-- Step 4 -->
    <text x="20" y="226" fill="#6b7280" font-family="monospace" font-size="10">$</text>
    <text x="33" y="226" fill="#f97316" font-family="monospace" font-size="10">forjar drift</text>
    <text x="20" y="243" fill="#4ade80" font-family="monospace" font-size="9">0 drifted (BLAKE3)</text>

    <!-- Divider -->
    <line x1="20" y1="260" x2="240" y2="260" stroke="#374151" stroke-width="1"/>

    <!-- Zero deps callout -->
    <text x="130" y="282" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">ZERO THIRD-PARTY</text>
    <text x="130" y="298" text-anchor="middle" fill="#6b7280" font-family="monospace" font-size="9">100% PAIML stack</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="514" width="1200" height="6" fill="url(#accent)" opacity="0.8"/>
</svg>
