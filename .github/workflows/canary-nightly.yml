name: Jetson Canary

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC (2am ET) daily
  workflow_dispatch: {}   # manual trigger via GitHub UI

# Only one canary run at a time
concurrency:
  group: jetson-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: self-hosted  # intel (192.168.50.100)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Canary pipeline
        run: bash scripts/canary-jetson.sh

      - name: Commit results
        run: |
          git add machines/jetson/canary/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "$(cat <<'EOF'
          canary: $(date +%Y-%m-%d) jetson nightly results

          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
          EOF
          )"
          git push
